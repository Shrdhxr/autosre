apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: chaos-memory-stress-emailservice
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: emailservice
  stressors:
    memory:
      workers: 1
      size: "100MiB"
  duration: "60s"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: chaos-memory-stress-shippingservice
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: shippingservice
  stressors:
    memory:
      workers: 1
      size: "100MiB"
  duration: "60s"