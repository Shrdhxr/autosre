apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autosreincidents.autosre.io
spec:
  group: autosre.io
  names:
    kind: AutoSREIncident
    plural: autosreincidents
    singular: autosreincident
    shortNames:
      - asi
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                service:
                  type: string
                  description: "The affected Kubernetes service/deployment name"
                anomalyType:
                  type: string
                  description: "Type of anomaly detected (CRASH_LOOP, HIGH_CPU, etc.)"
                severity:
                  type: string
                  enum: ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
                diagnosis:
                  type: string
                  description: "Root cause diagnosis from the LLM agent"
                recommendedAction:
                  type: string
                  enum: ["restart_pod", "scale_deployment", "rollback_deployment", "none"]
                confidence:
                  type: number
                  description: "LLM confidence score for this diagnosis (0.0-1.0)"
              required:
                - service
                - anomalyType
                - severity
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "AwaitingApproval", "Approved", "Executing", "Retrying", "Skipped", "Completed", "Failed"]
                approvalState:
                  type: string
                  enum: ["NotRequired", "Waiting", "Approved", "Denied"]
                remediationAction:
                  type: string
                startTime:
                  type: string
                completionTime:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp